<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — G-Set</title>
  <link rel="icon" href="assets/logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>@media print { .sidebar, .topbar, .fab, .no-print { display: none !important; } .content { padding: 0 !important; } body { background: #fff !important; color: #000 !important; } .glass { background: #fff !important; border: 1px solid #ccc !important; } }</style>
</head>
<body>
  <div class="app-shell" id="appShell"></div>

  <template id="pageTpl">
    <div class="panel-head no-print">
      <div>
        <div class="eyebrow">Reporting</div>
        <h1 style="font-size:1.6rem;margin:0">Patient Transfer Reports</h1>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-ghost btn-sm" id="exCsv"><i class="fa-solid fa-file-csv me-1"></i>CSV</button>
        <button class="btn btn-ghost btn-sm" id="exXlsx"><i class="fa-solid fa-file-excel me-1"></i>Excel</button>
        <button class="btn btn-ghost btn-sm" id="exPdf"><i class="fa-solid fa-file-pdf me-1"></i>PDF</button>
        <button class="btn btn-ems btn-sm" id="exPrint"><i class="fa-solid fa-print me-1"></i>Print</button>
      </div>
    </div>

    <div class="glass panel mb-3 no-print">
      <div class="row g-2 align-items-end">
        <div class="col-6 col-md"><label class="form-label">From</label><input type="date" class="form-select" id="fFrom"></div>
        <div class="col-6 col-md"><label class="form-label">To</label><input type="date" class="form-select" id="fTo"></div>
        <div class="col-6 col-md"><label class="form-label">District</label><select class="form-select" id="fDistrict"><option value="">All</option></select></div>
        <div class="col-6 col-md"><label class="form-label">Station</label><select class="form-select" id="fStation"><option value="">All</option></select></div>
        <div class="col-6 col-md"><label class="form-label">Status</label><select class="form-select" id="fStatus"><option value="">All</option><option>Active</option><option>Closed</option></select></div>
        <div class="col-6 col-md"><label class="form-label">Diagnosis</label><input class="form-control" id="fDiag" placeholder="contains…"></div>
        <div class="col-12 col-md-auto"><button class="btn btn-ems w-100" id="applyBtn"><i class="fa-solid fa-filter me-1"></i>Apply</button></div>
      </div>
    </div>

    <div id="reportHeader" class="mb-3 d-none">
      <h2 style="margin:0">G-Set Patient Transfer Report</h2>
      <div class="text-dim" id="reportMeta"></div>
    </div>

    <div class="glass panel">
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="repTable" style="width:100%">
          <thead><tr>
            <th>Incident</th><th>Date</th><th>Patient</th><th>Age</th><th>Gender</th>
            <th>District</th><th>Station</th><th>Vehicle</th><th>Referring</th><th>Receiving</th>
            <th>Diagnosis</th><th>Status</th><th>Delivered</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </template>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="js/reports.js"></script>
</body>
</html>
