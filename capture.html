<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capture Patient — G-Set</title>
  <link rel="icon" href="assets/logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell" id="appShell"></div>

  <template id="pageTpl">
    <div class="panel-head">
      <div>
        <div class="eyebrow">Emergency Dispatch</div>
        <h1 style="font-size:1.6rem;margin:0">New Patient Transfer</h1>
      </div>
      <a href="journeys.html" class="btn btn-ghost btn-sm"><i class="fa-solid fa-route me-1"></i> Active Journeys</a>
    </div>

    <form id="captureForm" class="glass panel" autocomplete="off" novalidate>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Incident Number</label>
          <input class="form-control" id="incidentNumber" readonly placeholder="generating…" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="incidentDate">Date</label>
          <input type="date" class="form-control" id="incidentDate" required />
        </div>
        <div class="col-md-4">
          <label class="form-label">Journey Status</label>
          <input class="form-control" value="Active — capturing" readonly />
        </div>

        <div class="col-12"><hr style="border-color:var(--glass-line)" /></div>

        <div class="col-md-6">
          <label class="form-label" for="referringFacility">Referring Facility</label>
          <input class="form-control" id="referringFacility" style="text-transform:uppercase" placeholder="Start typing a facility…" required />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="receivingFacility">Receiving Facility</label>
          <input class="form-control" id="receivingFacility" style="text-transform:uppercase" placeholder="Start typing a facility…" required />
        </div>

        <div class="col-md-4">
          <label class="form-label" for="district">District</label>
          <select class="form-select" id="district" required><option value="">Select district…</option></select>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="station">EMS Station</label>
          <select class="form-select" id="station" required><option value="">Select district first…</option></select>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="vehicle">G-Set Vehicle Registration</label>
          <input class="form-control" id="vehicle" style="text-transform:uppercase" placeholder="e.g. GS-001-GP" required />
          <small class="text-faint">Type any registration manually — suggestions are optional.</small>
        </div>

        <div class="col-12"><hr style="border-color:var(--glass-line)" /></div>

        <div class="col-md-6">
          <label class="form-label" for="patientName">Patient Name</label>
          <input class="form-control" id="patientName" style="text-transform:uppercase" placeholder="Full name" required />
        </div>
        <div class="col-md-3">
          <label class="form-label" for="age">Age</label>
          <input type="number" min="0" max="130" class="form-control" id="age" required />
        </div>
        <div class="col-md-3">
          <label class="form-label" for="gender">Gender</label>
          <select class="form-select" id="gender" required>
            <option value="">Select…</option><option>Female</option><option>Male</option><option>Other</option><option>Unknown</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="diagnosis">Provisional Diagnosis</label>
          <input class="form-control" id="diagnosis" style="text-transform:uppercase" placeholder="e.g. Acute myocardial infarction" required />
        </div>

        <div class="col-md-6">
          <label class="form-label">Captured By</label>
          <input class="form-control" id="capturedBy" readonly />
        </div>
        <div class="col-md-6">
          <label class="form-label">Time Captured</label>
          <input class="form-control" value="Set automatically on save" readonly />
        </div>
      </div>

      <div class="d-flex gap-2 justify-content-end mt-4">
        <button type="reset" class="btn btn-ghost"><i class="fa-solid fa-eraser me-1"></i> Clear</button>
        <button type="submit" class="btn btn-ems" id="saveBtn"><i class="fa-solid fa-plus me-1"></i> Open Journey</button>
      </div>
    </form>
  </template>

  <button class="fab" id="fabJourneys" title="Active journeys" onclick="location.href='journeys.html'"><i class="fa-solid fa-route"></i></button>

  <script type="module" src="js/capture.js"></script>
</body>
</html>
