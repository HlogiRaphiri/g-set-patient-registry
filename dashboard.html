<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — G-Set</title>
  <link rel="icon" href="assets/logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell" id="appShell"></div>

  <template id="pageTpl">
    <div class="panel-head">
      <div>
        <div class="eyebrow">Executive Overview</div>
        <h1 style="font-size:1.6rem;margin:0">Operations Dashboard</h1>
      </div>
      <button class="btn btn-ghost btn-sm" id="refreshBtn"><i class="fa-solid fa-rotate me-1"></i> Refresh</button>
    </div>

    <!-- Filters -->
    <div class="glass panel mb-4">
      <div class="row g-2 align-items-end">
        <div class="col-6 col-md"><label class="form-label">From</label><input type="date" class="form-select" id="fFrom"></div>
        <div class="col-6 col-md"><label class="form-label">To</label><input type="date" class="form-select" id="fTo"></div>
        <div class="col-6 col-md"><label class="form-label">District</label><select class="form-select" id="fDistrict"><option value="">All</option></select></div>
        <div class="col-6 col-md"><label class="form-label">Station</label><select class="form-select" id="fStation"><option value="">All</option></select></div>
        <div class="col-6 col-md"><label class="form-label">Vehicle</label><select class="form-select" id="fVehicle"><option value="">All</option></select></div>
        <div class="col-6 col-md"><label class="form-label">Status</label><select class="form-select" id="fStatus"><option value="">All</option><option>Active</option><option>Closed</option></select></div>
        <div class="col-12 col-md-2 d-flex gap-2">
          <button class="btn btn-ems w-100" id="applyFilters"><i class="fa-solid fa-filter me-1"></i>Apply</button>
          <button class="btn btn-ghost" id="clearFilters" title="Clear"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
    </div>

    <!-- KPI cards -->
    <div class="kpi-grid mb-4" id="kpiGrid"></div>

    <!-- Charts -->
    <div class="row g-3">
      <div class="col-lg-8"><div class="glass chart-card"><div class="panel-head"><h3>Daily Patient Trend</h3></div><canvas id="cDaily"></canvas></div></div>
      <div class="col-lg-4"><div class="glass chart-card"><div class="panel-head"><h3>Journey Status</h3></div><canvas id="cStatus"></canvas></div></div>
      <div class="col-lg-6"><div class="glass chart-card"><div class="panel-head"><h3>Monthly Trend</h3></div><canvas id="cMonthly"></canvas></div></div>
      <div class="col-lg-6"><div class="glass chart-card"><div class="panel-head"><h3>District Comparison</h3></div><canvas id="cDistrict"></canvas></div></div>
      <div class="col-lg-6"><div class="glass chart-card"><div class="panel-head"><h3>EMS Station Comparison</h3></div><canvas id="cStation"></canvas></div></div>
      <div class="col-lg-6"><div class="glass chart-card"><div class="panel-head"><h3>Vehicle Utilisation</h3></div><canvas id="cVehicle"></canvas></div></div>
      <div class="col-lg-4"><div class="glass chart-card"><div class="panel-head"><h3>Age Distribution</h3></div><canvas id="cAge"></canvas></div></div>
      <div class="col-lg-4"><div class="glass chart-card"><div class="panel-head"><h3>Hourly Activity</h3></div><canvas id="cHourly"></canvas></div></div>
      <div class="col-lg-4"><div class="glass chart-card"><div class="panel-head"><h3>Diagnosis Breakdown</h3></div><canvas id="cDiag"></canvas></div></div>
      <div class="col-lg-6"><div class="glass chart-card"><div class="panel-head"><h3>Top Referring Facilities</h3></div><canvas id="cRefFac"></canvas></div></div>
      <div class="col-lg-6"><div class="glass chart-card"><div class="panel-head"><h3>Top Receiving Facilities</h3></div><canvas id="cRecFac"></canvas></div></div>
    </div>

    <!-- Recent table -->
    <div class="glass panel mt-4">
      <div class="panel-head"><h3>Recent Patients</h3></div>
      <div class="table-responsive">
        <table class="table table-hover align-middle"><thead><tr>
          <th>Incident</th><th>Patient</th><th>District</th><th>Vehicle</th><th>Captured</th><th>Status</th>
        </tr></thead><tbody id="recentBody"></tbody></table>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
